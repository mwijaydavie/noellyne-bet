name: football_admin
description: Noellyne Bet — football streaming admin dashboard.
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.20.0
  shared_preferences: ^2.5.3
  http: ^1.2.2
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  crypto: ^3.0.6
  posthog_flutter: ^5.40.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  flutter_inappwebview: ^6.2.0-beta.3
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  uses-material-design: true
